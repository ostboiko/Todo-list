{% extends 'catalog/base.html' %}

{% block content %}
    <h1>Confirm Delete Task</h1>
    <p>Are you sure you want to delete the task "{{ task.content }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'home' %}">Cancel</a>
    </form>
{% endblock %}
